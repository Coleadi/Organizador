:root[data-theme="dark"]{--bg:#2A2829;--panel:#222021;--card:#353233;--tx:#F1EBE4;--mut:#B3A99C;--line:#4A4647;--ac:#97B5DF;--onac:#2A2829;--acs:#2F3F8C;--s1:#97B5DF;--s2:#7C9AD0;--s3:#5A72B8;--s4:#3A52BF;--sf:#F1EBE4;--ck:#F1EBE4;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:flex;height:100%}
aside{--tx:#F1EBE4;--mut:#97B5DF;--line:rgba(241,235,228,.16);--acs:rgba(241,235,228,.12);--card:rgba(255,255,255,.07);--ac:#97B5DF;--onac:#2A2829;width:250px;background:var(--panel);border-right:1px solid rgba(0,0,0,.12);color:var(--tx);display:flex;flex-direction:column;padding:14px 10px;flex:none}
.hm{display:flex;align-items:center;gap:9px;background:none;border:0;text-align:left;cursor:pointer;margin:2px 0 12px;padding:4px 8px;border-radius:6px;color:#F1EBE4}
.logo{display:block;flex:none;width:30px;height:30px;background:var(--logo) center/contain no-repeat}
.wm{font:600 18px/1 "Poppins","Avenir Next","Century Gothic","Trebuchet MS",system-ui,sans-serif;letter-spacing:.2px;color:#F1EBE4}
.mb{background:#2A2829!important;border-bottom:0!important;align-items:center}.mb .btn.g{color:#F1EBE4;border-color:rgba(151,181,223,.5)}.mb .logo{width:26px;height:26px}.mb .wm{font-size:16px}
.hm:hover,.hm.on{background:var(--acs)}
.pg{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg:hover{background:var(--line)}.pg.on{background:var(--acs);color:#fff}
.list{flex:1;overflow:auto;margin-top:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:var(--onac);font-weight:700;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);font-weight:700;border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
main{flex:1;overflow:auto;padding:40px 56px}
main.mp{padding:0;overflow:hidden}
.wrap{max-width:760px;margin:0 auto}main.mp .wrap{max-width:none;height:100%}
.title{width:100%;border:0;background:transparent;font:700 34px system-ui,-apple-system,"Segoe UI",sans-serif;padding:0;margin-bottom:4px}
.dsc{width:100%;border:0;background:transparent;color:var(--mut);padding:0;margin:0 0 24px}
textarea.body{width:100%;min-height:60vh;border:0;background:transparent;resize:none;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
details.card>summary{cursor:pointer;font-weight:600;list-style:none}
details.card>summary::before{content:"▾ ";color:var(--mut)}details.card:not([open])>summary::before{content:"▸ "}
details.card[open]>summary{margin-bottom:10px}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:8px;transition:width .8s cubic-bezier(.2,.8,.2,1),background .4s}
.bar i.c1{background:var(--s1)}.bar i.c2{background:var(--s2)}.bar i.c3{background:var(--s3)}.bar i.c4{background:var(--s4)}
.bar i.full{background:var(--sf)}
.task{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);border-radius:6px}
.task.d .tt{text-decoration:line-through;color:var(--mut)}
.task.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.03);background:var(--acs)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.task.pop{animation:none}.bar i{transition:none}}
.task input[type=checkbox],.debt input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac);flex:none}
.task .tt{flex:1;min-width:0;outline:0;cursor:text}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:flex-end}
.row>*{flex:1;min-width:140px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.card h3{margin:0 0 10px;font-size:15px}
.leg{font-size:13px;color:var(--mut);margin-top:8px}
.leg div{display:flex;gap:6px;align-items:center}
.leg b{width:10px;height:10px;border-radius:50%;flex:none}
.leg em{margin-left:auto;font-style:normal;color:var(--tx)}
.debt{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid var(--line);border-radius:6px;cursor:pointer;user-select:none}
.debt.sel{background:var(--acs)}
.debt div{flex:1}.debt small{color:var(--mut);display:block}
.tpl{display:grid;gap:8px;margin-bottom:10px}
.tpl button{font-weight:700;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.tpl button:hover{border-color:var(--ac)}.tpl small{display:block;color:var(--mut)}
.empty,.err{color:var(--mut);padding:8px 0}.err{color:#b4493a;padding:6px 0 0}
.mapv{position:relative;width:100%;height:100%;overflow:hidden;cursor:grab;background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:24px 24px}
.mapv.gr{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.nd{position:absolute}
.pn{width:180px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:600;cursor:pointer;user-select:none}
.pn:hover{border-color:var(--ac)}.pn small{display:block;font-weight:400;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn{width:210px;border:1px dashed var(--mut);border-radius:10px;background:var(--bg)}
.hd{display:flex;justify-content:space-between;color:var(--mut);cursor:move;padding:2px 8px;font-size:12px}
.tx{padding:2px 10px 10px;outline:0;min-height:32px;white-space:pre-wrap;cursor:text}
.tb{position:absolute;left:16px;bottom:16px;display:flex;gap:10px;align-items:center;color:var(--mut);font-size:13px}
.mt{position:absolute;left:50%;top:40%;transform:translateX(-50%);color:var(--mut);text-align:center;pointer-events:none}
.mb{display:none}.mapv{touch-action:none}
[hidden]{display:none!important}
.hh{order:-2}[data-act="toggle"]{order:-1}
.hm,.hm.on,.hm:hover,.hm:focus,.hm:focus-visible{background:none;outline:none}.hm:focus-visible{text-decoration:underline}
